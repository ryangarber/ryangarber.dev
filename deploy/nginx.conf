# Example server block; install on Linode and configure TLS separately.
server {
    listen 80;
    server_name ryangarber.dev;
    root /var/www/ryangarber.dev;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
